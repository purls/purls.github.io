<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="icon" href="../images/romero.ico" type="image/x-icon" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Screensaver</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../tools.css" />
    <style>
        body {
            max-width: 700px;
        }

        html.ss-open,
        html.ss-open body {
            overflow: hidden;
        }

        .section-title {
            color: #555;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 22px 0 10px;
            padding-bottom: 6px;
            border-bottom: 1px solid #2a2a2a;
        }

        .field-row {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .field-row label {
            min-width: 88px;
            color: #888;
            font-size: 13px;
        }

        .field-row.stacked {
            align-items: flex-start;
        }

        .hint {
            font-size: 11px;
            color: #555;
            margin: -6px 0 12px 98px;
        }

        textarea#textInput,
        select {
            background-color: #2d2d2d;
            color: #e0e0e0;
            border: 1px solid #3d3d3d;
            border-radius: 4px;
            padding: 6px 8px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
        }

        textarea#textInput {
            flex: 1;
            min-width: 0;
            width: auto;
            margin-bottom: 0;
            line-height: 1.4;
            min-height: 62px;
            field-sizing: content;
            max-height: 40vh;
        }

        textarea#textInput:focus,
        select:focus {
            outline: 2px solid #4cafac;
        }

        .color-swatches {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }

        .swatch {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: pointer;
            border: 3px solid transparent;
            box-sizing: border-box;
            transition: transform 0.15s, border-color 0.15s;
            flex-shrink: 0;
        }

        .swatch:hover {
            transform: scale(1.2);
        }

        .swatch.selected {
            border-color: #e0e0e0;
            transform: scale(1.1);
        }

        input[type="color"] {
            width: 38px;
            height: 28px;
            padding: 1px 2px;
            border: 1px solid #3d3d3d;
            border-radius: 4px;
            background: #2d2d2d;
            cursor: pointer;
        }

        .preview-box {
            background: #050505;
            border: 1px solid #2a2a2a;
            border-radius: 4px;
            height: 110px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            margin-bottom: 16px;
        }

        #previewText {
            white-space: pre;
            text-align: center;
            font-weight: bold;
            line-height: 1.2;
            width: max-content;
        }

        .launch-btn {
            padding: 11px 28px;
            background-color: #1a4444;
            font-size: 14px;
            border-radius: 4px;
            margin-top: 4px;
        }

        .launch-btn:hover {
            background-color: #226666;
        }

        @media (max-width: 560px) {

            /* 16px keeps iOS from zooming the page when a field is focused */
            textarea#textInput,
            select {
                font-size: 16px;
            }

            .field-row label {
                min-width: 100%;
            }

            .hint {
                margin-left: 0;
            }

            .launch-btn {
                width: 100%;
            }
        }

        /* Screensaver overlay */
        #screensaver {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            height: 100dvh;
            background: #000;
            z-index: 9999;
            overflow: hidden;
            cursor: none;
            touch-action: none;
            overscroll-behavior: none;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        #screensaver.active {
            display: block;
        }

        #ss-canvas {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
            display: none;
        }

        #ss-content {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        #exit-hint {
            position: absolute;
            bottom: calc(14px + env(safe-area-inset-bottom));
            right: calc(16px + env(safe-area-inset-right));
            color: rgba(255, 255, 255, 0.12);
            font-size: 10px;
            font-family: 'JetBrains Mono', monospace;
            letter-spacing: 1px;
            pointer-events: none;
            z-index: 2;
            transition: opacity 1.5s;
        }

        #exit-hint.faded {
            opacity: 0;
        }

        #click-dots {
            position: absolute;
            bottom: calc(14px + env(safe-area-inset-bottom));
            left: calc(16px + env(safe-area-inset-left));
            display: flex;
            gap: 6px;
            z-index: 2;
            pointer-events: none;
        }

        .click-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            transition: background 0.15s;
        }

        .click-dot.lit {
            background: rgba(255, 255, 255, 0.85);
        }

        /* Typewriter cursor */
        @keyframes blink {

            0%,
            49% {
                opacity: 1;
            }

            50%,
            100% {
                opacity: 0;
            }
        }

        .tw-cursor {
            animation: blink 0.9s step-end infinite;
        }

        /* Neon pulse */
        @keyframes neonPulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.72;
            }
        }
    </style>
</head>

<body>
    <div class="header-top">
        <h1 style="margin: 0;">Screensaver</h1>
        <a href="https://localhost.beer" class="home-link">← home</a>
    </div>
    <p style="margin: 0 0 2px;">Configure your screensaver-style text display, then go fullscreen.</p>
    <p style="font-size: 12px; color: #555; margin: 0;">Triple-click/tap anywhere (or press Escape) to exit.</p>

    <!-- Text -->
    <div class="section-title">Text</div>
    <div class="field-row stacked">
        <label for="textInput" style="padding-top: 7px;">Display text</label>
        <textarea id="textInput" rows="2" maxlength="300" spellcheck="false"
            placeholder="localhost.beer">localhost.beer</textarea>
    </div>
    <div class="hint">Multiple lines are supported. Press Enter for a new line, Ctrl+Enter to launch.</div>
    <div class="field-row">
        <label for="fontSize">Font size</label>
        <select id="fontSize">
            <option value="4">Small</option>
            <option value="7" selected>Medium</option>
            <option value="12">Large</option>
            <option value="18">Huge</option>
        </select>
    </div>

    <!-- Animation -->
    <div class="section-title">Animation</div>
    <div class="field-row">
        <label for="animMode">Mode</label>
        <select id="animMode">
            <option value="static">Static: Text centered</option>
            <option value="dvd">DVD: Bouncing text</option>
            <option value="matrix">Matrix: Code rain</option>
            <option value="typewriter">Typewriter: Terminal typing</option>
            <option value="glitch">Glitch: Scramble bursts</option>
            <option value="neon">Neon: Pulsing glow</option>
            <option value="float">Float: Drifting words</option>
        </select>
    </div>
    <div class="field-row">
        <label for="speed">Speed</label>
        <select id="speed">
            <option value="0.5">Slow</option>
            <option value="1" selected>Normal</option>
            <option value="2">Fast</option>
        </select>
    </div>

    <!-- Color -->
    <div class="section-title">Color</div>
    <div class="field-row" style="align-items: center;">
        <label>Theme</label>
        <div class="color-swatches" id="colorSwatches">
            <span class="swatch selected" data-color="rainbow" title="Rainbow"
                style="background: conic-gradient(red, orange, yellow, green, cyan, blue, violet, red);"></span>
            <span class="swatch" data-color="#00ff41" title="Matrix Green" style="background: #00ff41;"></span>
            <span class="swatch" data-color="#4cafac" title="Teal" style="background: #4cafac;"></span>
            <span class="swatch" data-color="#ff6b6b" title="Red" style="background: #ff6b6b;"></span>
            <span class="swatch" data-color="#bd93f9" title="Purple" style="background: #bd93f9;"></span>
            <span class="swatch" data-color="#ffb86c" title="Orange" style="background: #ffb86c;"></span>
            <span class="swatch" data-color="#f1fa8c" title="Yellow" style="background: #f1fa8c;"></span>
            <span class="swatch" data-color="#ffffff" title="White" style="background: #fff;"></span>
            <input type="color" id="customColor" title="Custom color" value="#4cafac" />
        </div>
    </div>

    <!-- Preview -->
    <div class="section-title">Preview</div>
    <div class="preview-box">
        <div id="previewText" style="font-size: 26px; color: #4cafac;">localhost.beer</div>
    </div>

    <button class="launch-btn" id="launchBtn">▶ Launch Screensaver</button>

    <!-- Screensaver overlay -->
    <div id="screensaver">
        <canvas id="ss-canvas"></canvas>
        <div id="ss-content"></div>
        <div id="exit-hint">click/tap × 3 to exit</div>
        <div id="click-dots">
            <div class="click-dot" id="dot1"></div>
            <div class="click-dot" id="dot2"></div>
            <div class="click-dot" id="dot3"></div>
        </div>
    </div>

    <script>
        (() => {
            // State
            let selectedColor = 'rainbow';
            let cleanupFns = [];
            let resizeFns = [];
            let clickCount = 0, clickTimer = null, hintTimer = null, resizeRaf = null;
            let wakeLock = null;

            const FONT = "'JetBrains Mono', monospace";
            const RAINBOW = ['#ff6b6b', '#ffb86c', '#f1fa8c', '#50fa7b', '#4cafac', '#bd93f9', '#ff79c6', '#8be9fd'];
            const GRADIENT = 'linear-gradient(90deg,#ff6b6b,#ffb86c,#f1fa8c,#50fa7b,#4cafac,#bd93f9)';

            // Config elements
            const textInput = document.getElementById('textInput');
            const fontSizeEl = document.getElementById('fontSize');
            const animModeEl = document.getElementById('animMode');
            const speedEl = document.getElementById('speed');
            const launchBtn = document.getElementById('launchBtn');
            const prevText = document.getElementById('previewText');
            const prevBox = prevText.parentElement;

            // Screensaver elements
            const screensaver = document.getElementById('screensaver');
            const ssCanvas = document.getElementById('ss-canvas');
            const ssContent = document.getElementById('ss-content');
            const exitHint = document.getElementById('exit-hint');
            const dots = [document.getElementById('dot1'), document.getElementById('dot2'), document.getElementById('dot3')];

            // Color swatches
            document.querySelectorAll('.swatch').forEach(s => {
                s.addEventListener('click', () => {
                    document.querySelectorAll('.swatch').forEach(x => x.classList.remove('selected'));
                    s.classList.add('selected');
                    selectedColor = s.dataset.color;
                    updatePreview();
                });
            });

            document.getElementById('customColor').addEventListener('input', e => {
                document.querySelectorAll('.swatch').forEach(x => x.classList.remove('selected'));
                selectedColor = e.target.value;
                updatePreview();
            });

            function currentText() {
                return textInput.value.replace(/\r\n?/g, '\n').replace(/^\s*\n+|\s+$/g, '');
            }

            function updatePreview() {
                prevText.textContent = currentText() || 'localhost.beer';
                prevText.style.removeProperty('background');
                prevText.style.removeProperty('-webkit-background-clip');
                prevText.style.removeProperty('-webkit-text-fill-color');
                if (selectedColor === 'rainbow') {
                    prevText.style.background = GRADIENT;
                    prevText.style.webkitBackgroundClip = 'text';
                    prevText.style.webkitTextFillColor = 'transparent';
                } else {
                    prevText.style.color = selectedColor;
                }
                // shrink the preview so long / multi-line text stays fully visible
                prevText.style.fontSize = '26px';
                const w = prevText.offsetWidth, h = prevText.offsetHeight;
                if (w && h) {
                    const s = Math.min(1, (prevBox.clientWidth - 16) / w, (prevBox.clientHeight - 12) / h);
                    prevText.style.fontSize = Math.max(7, Math.floor(26 * s)) + 'px';
                }
            }

            textInput.addEventListener('input', updatePreview);
            textInput.addEventListener('keydown', e => {
                if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); launch(); }
            });

            // Launch
            function launch() {
                const text = currentText() || 'localhost.beer';
                const sizeVmin = parseFloat(fontSizeEl.value);
                const mode = animModeEl.value;
                const speed = parseFloat(speedEl.value);
                startScreensaver(text, sizeVmin, mode, selectedColor, speed);
            }
            launchBtn.addEventListener('click', launch);

            // Exit triggers
            screensaver.addEventListener('click', handleClick);

            document.addEventListener('keydown', e => {
                if (e.key === 'Escape' && screensaver.classList.contains('active')) exitScreensaver();
            });

            document.addEventListener('fullscreenchange', () => {
                if (!document.fullscreenElement && screensaver.classList.contains('active')) exitScreensaver();
                else fireResize();
            });

            // Viewport changes: fullscreen transitions, rotation, mobile toolbar show/hide
            window.addEventListener('resize', fireResize);
            window.addEventListener('orientationchange', fireResize);

            function fireResize() {
                if (resizeRaf) cancelAnimationFrame(resizeRaf);
                resizeRaf = requestAnimationFrame(() => {
                    resizeRaf = null;
                    if (!screensaver.classList.contains('active')) { updatePreview(); return; }
                    resizeFns.forEach(fn => { try { fn(); } catch (_) { } });
                });
            }

            function handleClick() {
                clickCount++;
                dots.slice(0, clickCount).forEach(d => d.classList.add('lit'));
                if (clickTimer) clearTimeout(clickTimer);
                clickTimer = setTimeout(() => {
                    clickCount = 0;
                    dots.forEach(d => d.classList.remove('lit'));
                }, 2000);
                if (clickCount >= 3) exitScreensaver();
            }

            // Core: start / exit
            function startScreensaver(text, sizeVmin, mode, color, speed) {
                clickCount = 0;
                dots.forEach(d => d.classList.remove('lit'));

                exitHint.classList.remove('faded');
                if (hintTimer) clearTimeout(hintTimer);
                hintTimer = setTimeout(() => exitHint.classList.add('faded'), 4500);

                screensaver.style.background = (mode === 'neon') ? '#020008' : '#000';
                screensaver.classList.add('active');
                document.documentElement.classList.add('ss-open');
                screensaver.requestFullscreen?.().catch(() => { });
                requestWakeLock();

                ssContent.innerHTML = '';
                ssCanvas.style.display = 'none';
                ssCanvas.getContext('2d').clearRect(0, 0, ssCanvas.width, ssCanvas.height);

                if (mode === 'static') startStatic(text, sizeVmin, color, speed);
                else if (mode === 'dvd') startDVD(text, sizeVmin, color, speed);
                else if (mode === 'matrix') startMatrix(text, sizeVmin, color, speed);
                else if (mode === 'typewriter') startTypewriter(text, sizeVmin, color, speed);
                else if (mode === 'glitch') startGlitch(text, sizeVmin, color, speed);
                else if (mode === 'neon') startNeon(text, sizeVmin, color, speed);
                else if (mode === 'float') startFloat(text, sizeVmin, color, speed);

                // The viewport keeps growing as fullscreen / mobile chrome settles,
                // so re-measure a couple of times after launch.
                [80, 300, 700].forEach(ms => setTimeout(() => {
                    if (screensaver.classList.contains('active')) fireResize();
                }, ms));
            }

            function exitScreensaver() {
                clickCount = 0;
                if (clickTimer) clearTimeout(clickTimer);
                dots.forEach(d => d.classList.remove('lit'));
                screensaver.classList.remove('active');
                document.documentElement.classList.remove('ss-open');
                screensaver.style.background = '#000';
                cleanupFns.forEach(fn => { try { fn(); } catch (_) { } });
                cleanupFns = [];
                resizeFns = [];
                ssContent.innerHTML = '';
                ssCanvas.style.display = 'none';
                releaseWakeLock();
                if (document.fullscreenElement) document.exitFullscreen?.().catch(() => { });
                updatePreview();
            }

            function reg(fn) { cleanupFns.push(fn); }
            function onResize(fn) { resizeFns.push(fn); }

            // Keep the display awake while it is showing text
            function requestWakeLock() {
                if (!navigator.wakeLock) return;
                navigator.wakeLock.request('screen')
                    .then(lock => {
                        if (!screensaver.classList.contains('active')) { lock.release().catch(() => { }); return; }
                        wakeLock = lock;
                    })
                    .catch(() => { });
            }

            function releaseWakeLock() {
                if (wakeLock) { wakeLock.release().catch(() => { }); wakeLock = null; }
            }

            // Helpers
            function dims() {
                const r = screensaver.getBoundingClientRect();
                return {
                    W: Math.round(r.width) || window.innerWidth,
                    H: Math.round(r.height) || window.innerHeight,
                };
            }

            // Font size options are expressed in vmin so they adapt to phone screens.
            function basePx(sizeVmin) {
                const { W, H } = dims();
                return Math.max(9, Math.round(Math.min(W, H) * sizeVmin / 100));
            }

            // Set the font size, then shrink it until the block fits the screen.
            // Text metrics scale linearly, so a single corrective pass is exact.
            function fitEl(el, sizeVmin, ratio) {
                const { W, H } = dims();
                const px = basePx(sizeVmin);
                el.style.fontSize = px + 'px';
                const w = Math.max(el.offsetWidth, el.scrollWidth);
                const h = Math.max(el.offsetHeight, el.scrollHeight);
                if (!w || !h) return px;
                const s = Math.min(1, (W * ratio) / w, (H * ratio) / h);
                const fs = Math.max(7, Math.floor(px * s));
                el.style.fontSize = fs + 'px';
                return fs;
            }

            function pickColor(color, idx) {
                return color === 'rainbow' ? RAINBOW[((idx % RAINBOW.length) + RAINBOW.length) % RAINBOW.length] : color;
            }

            function makeEl(tag, css, text) {
                const el = document.createElement(tag);
                Object.assign(el.style, css);
                if (text != null) el.textContent = text;
                ssContent.appendChild(el);
                return el;
            }

            // Base style for any block of display text: honours newlines, never wraps,
            // and shrink-wraps to its longest line so it can be measured accurately.
            function textCss(extra) {
                return Object.assign({
                    fontFamily: FONT,
                    fontWeight: 'bold',
                    whiteSpace: 'pre',
                    lineHeight: '1.2',
                    textAlign: 'center',
                    width: 'max-content',
                    userSelect: 'none',
                }, extra);
            }

            function centered(extra) {
                return textCss(Object.assign({
                    position: 'absolute',
                    top: '50%', left: '50%',
                    transform: 'translate(-50%, -50%)',
                }, extra));
            }

            // Static (text centered, no animation)
            function startStatic(text, sizeVmin, color) {
                const el = makeEl('div', centered(), text);

                if (color === 'rainbow') {
                    el.style.background = GRADIENT;
                    el.style.webkitBackgroundClip = 'text';
                    el.style.webkitTextFillColor = 'transparent';
                } else {
                    el.style.color = color;
                }

                const fit = () => fitEl(el, sizeVmin, 0.9);
                fit();
                onResize(fit);
            }

            // DVD (bouncing text, changes color on wall hit)
            function startDVD(text, sizeVmin, color, speed) {
                const el = makeEl('div', textCss({
                    position: 'absolute',
                    textShadow: '0 0 18px currentColor',
                }), text);

                const fit = () => fitEl(el, sizeVmin, 0.55);
                fit();

                const base = speed * 2.2;
                let x = 0, y = 0;
                let dx = base * (Math.random() > 0.5 ? 1 : -1);
                let dy = base * 0.72 * (Math.random() > 0.5 ? 1 : -1);
                let colorIdx = 0;

                function applyColor() { el.style.color = pickColor(color, colorIdx++); }
                applyColor();

                {
                    const { W, H } = dims();
                    x = Math.max(0, (W - el.offsetWidth) / 2);
                    y = Math.max(0, (H - el.offsetHeight) / 2);
                }

                onResize(() => {
                    fit();
                    const { W, H } = dims();
                    x = Math.min(Math.max(0, x), Math.max(0, W - el.offsetWidth));
                    y = Math.min(Math.max(0, y), Math.max(0, H - el.offsetHeight));
                });

                let rafId;
                function frame() {
                    const { W, H } = dims();
                    const w = el.offsetWidth, h = el.offsetHeight;
                    x += dx; y += dy;
                    let hit = false;
                    if (x <= 0) { x = 0; dx = Math.abs(dx); hit = true; }
                    if (x + w >= W) { x = W - w; dx = -Math.abs(dx); hit = true; }
                    if (y <= 0) { y = 0; dy = Math.abs(dy); hit = true; }
                    if (y + h >= H) { y = H - h; dy = -Math.abs(dy); hit = true; }
                    if (hit) applyColor();
                    el.style.left = x + 'px';
                    el.style.top = y + 'px';
                    rafId = requestAnimationFrame(frame);
                }
                rafId = requestAnimationFrame(frame);
                reg(() => cancelAnimationFrame(rafId));
            }

            // Matrix (katakana rain + glowing center text)
            function startMatrix(text, sizeVmin, color, speed) {
                const rainColor = (color === 'rainbow' || color === '#ffffff') ? '#00ff41' : color;
                const CHARS = 'アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン0123456789ABCDEF#+-=/<>';

                ssCanvas.style.display = 'block';
                const ctx = ssCanvas.getContext('2d');

                let W = 0, H = 0, colW = 18, rowH = 20, drops = [];

                // Size the canvas from the overlay itself (not window.innerWidth), and
                // redo it on every viewport change. Otherwise, the rain stops short of
                // the bottom once fullscreen or a mobile toolbar changes the height.
                function layout() {
                    const d = dims();
                    W = d.W; H = d.H;
                    const dpr = Math.min(window.devicePixelRatio || 1, 2);
                    ssCanvas.width = Math.round(W * dpr);
                    ssCanvas.height = Math.round(H * dpr);
                    ssCanvas.style.width = W + 'px';
                    ssCanvas.style.height = H + 'px';
                    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                    ctx.fillStyle = '#000';
                    ctx.fillRect(0, 0, W, H);

                    colW = Math.max(10, Math.min(20, Math.round(Math.min(W, H) / 42)));
                    rowH = Math.round(colW * 1.15);
                    const cols = Math.ceil(W / colW);
                    const prev = drops;
                    drops = Array.from({ length: cols }, (_, i) =>
                        i < prev.length ? prev[i] : -((Math.random() * (H / rowH)) | 0));
                }
                layout();

                // glowing center overlay
                const label = makeEl('div', centered({
                    color: rainColor,
                    textShadow: `0 0 20px ${rainColor}, 0 0 40px ${rainColor}80`,
                    zIndex: '2',
                }), text);

                const fit = () => fitEl(label, sizeVmin, 0.85);
                fit();
                onResize(() => { layout(); fit(); });

                const skipInterval = Math.max(1, Math.round(3 / speed));
                let frameNum = 0, rafId;

                function draw() {
                    frameNum++;
                    if (frameNum % skipInterval === 0) {
                        ctx.fillStyle = 'rgba(0,0,0,0.05)';
                        ctx.fillRect(0, 0, W, H);
                        ctx.fillStyle = rainColor;
                        ctx.font = Math.round(colW * 0.86) + 'px monospace';
                        ctx.textBaseline = 'top';
                        for (let i = 0; i < drops.length; i++) {
                            const y = drops[i] * rowH;
                            if (y > -rowH && y < H) {
                                ctx.fillText(CHARS[Math.random() * CHARS.length | 0], i * colW, y);
                            }
                            if (y > H && Math.random() > 0.975) drops[i] = 0;
                            drops[i]++;
                        }
                    }
                    rafId = requestAnimationFrame(draw);
                }
                rafId = requestAnimationFrame(draw);
                reg(() => {
                    cancelAnimationFrame(rafId);
                    ssCanvas.style.display = 'none';
                });
            }

            // Typewriter (text types & deletes in a loop)
            function startTypewriter(text, sizeVmin, color, speed) {
                const container = makeEl('div', centered({
                    display: 'inline-grid',
                    textAlign: 'left',
                }));

                // A hidden copy of the full text holds the box open, so the centered
                // block never jumps around as characters and lines are added.
                const ghost = document.createElement('span');
                ghost.style.cssText = 'grid-area: 1 / 1; visibility: hidden;';
                ghost.textContent = text.split('\n').map(l => l + '█').join('\n');

                const live = document.createElement('span');
                live.style.cssText = 'grid-area: 1 / 1;';
                const textSpan = document.createElement('span');
                const cursorSpan = document.createElement('span');
                cursorSpan.className = 'tw-cursor';
                cursorSpan.textContent = '█';
                live.append(textSpan, cursorSpan);
                container.append(ghost, live);

                const fit = () => fitEl(container, sizeVmin, 0.85);
                fit();
                onResize(fit);

                let colorIdx = 0;
                function applyColor() {
                    const c = pickColor(color, colorIdx++);
                    container.style.color = c;
                    container.style.textShadow = `0 0 10px ${c}80`;
                }
                applyColor();

                const typeMs = 100 / speed;
                const deleteMs = 45 / speed;
                const pauseMs = 1400 / speed;

                let charIdx = 0, phase = 'typing', stopped = false, timer;

                function tick() {
                    if (stopped) return;
                    if (phase === 'typing') {
                        charIdx++;
                        textSpan.textContent = text.substring(0, charIdx);
                        if (charIdx >= text.length) {
                            phase = 'pausing';
                            timer = setTimeout(tick, pauseMs);
                        } else {
                            // newlines land instantly instead of stalling on a blank frame
                            const delay = text[charIdx - 1] === '\n' ? typeMs * 1.6 : typeMs * (0.6 + Math.random() * 0.8);
                            timer = setTimeout(tick, delay);
                        }
                    } else if (phase === 'pausing') {
                        phase = 'deleting';
                        timer = setTimeout(tick, deleteMs);
                    } else {
                        charIdx--;
                        textSpan.textContent = text.substring(0, charIdx);
                        if (charIdx <= 0) {
                            phase = 'typing';
                            applyColor();
                            timer = setTimeout(tick, pauseMs * 0.3);
                        } else {
                            timer = setTimeout(tick, deleteMs * (0.6 + Math.random() * 0.8));
                        }
                    }
                }
                tick();
                reg(() => { stopped = true; clearTimeout(timer); });
            }

            // Glitch (centered text with RGB-split scramble bursts)
            function startGlitch(text, sizeVmin, color, speed) {
                const outer = makeEl('div', centered());

                const layerCss = `
                font-size: inherit;
                font-family: ${FONT};
                font-weight: bold;
                white-space: pre;
                line-height: 1.2;
                text-align: center;
            `;

                const wrap = document.createElement('div');
                wrap.style.cssText = 'position: relative; display: inline-block;';
                const main = document.createElement('div');
                main.style.cssText = layerCss + 'position: relative;';
                main.textContent = text;
                const redGhost = document.createElement('div');
                redGhost.style.cssText = layerCss + 'position: absolute; top: 0; left: 0; width: 100%; color: #ff0040; opacity: 0; pointer-events: none;';
                redGhost.textContent = text;
                const blueGhost = document.createElement('div');
                blueGhost.style.cssText = layerCss + 'position: absolute; top: 0; left: 0; width: 100%; color: #00ffff; opacity: 0; pointer-events: none;';
                blueGhost.textContent = text;
                wrap.append(main, redGhost, blueGhost);
                outer.appendChild(wrap);

                const fit = () => fitEl(outer, sizeVmin, 0.82);
                fit();
                onResize(fit);

                let colorIdx = 0;
                function applyColor() {
                    const c = pickColor(color, colorIdx++);
                    main.style.color = c;
                    main.style.textShadow = `0 0 15px ${c}60`;
                }
                applyColor();

                const GCHARS = '!@#$%^&*<>?/|[]{}~`0123456789ABCDEFabcdef';
                let stopped = false, timer;

                function scheduleGlitch() {
                    if (stopped) return;
                    timer = setTimeout(doGlitch, (900 + Math.random() * 2200) / speed);
                }

                function doGlitch() {
                    if (stopped) return;
                    const offsetX = 4 + Math.random() * 9;
                    const pct1 = Math.random() * 55, pct2 = pct1 + 10 + Math.random() * 28;
                    redGhost.style.transform = `translate(${-offsetX}px, ${Math.random() * 4 - 2}px)`;
                    blueGhost.style.transform = `translate(${offsetX}px, ${Math.random() * 4 - 2}px)`;
                    redGhost.style.clipPath = `polygon(0 ${pct1}%, 100% ${pct1}%, 100% ${pct2}%, 0 ${pct2}%)`;
                    blueGhost.style.clipPath = `polygon(0 ${100 - pct2}%, 100% ${100 - pct2}%, 100% ${100 - pct1}%, 0 ${100 - pct1}%)`;
                    redGhost.style.opacity = '0.65';
                    blueGhost.style.opacity = '0.65';

                    let n = 0;
                    const maxFrames = 5 + Math.floor(Math.random() * 6);

                    function scramble() {
                        if (stopped) return;
                        let s = '';
                        for (let i = 0; i < text.length; i++) {
                            // keep line breaks intact so the block keeps its shape
                            s += (text[i] !== '\n' && Math.random() < 0.35)
                                ? GCHARS[Math.random() * GCHARS.length | 0]
                                : text[i];
                        }
                        main.textContent = s;
                        n++;
                        if (n < maxFrames) {
                            timer = setTimeout(scramble, 55 / speed);
                        } else {
                            main.textContent = text;
                            redGhost.textContent = blueGhost.textContent = text;
                            redGhost.style.opacity = blueGhost.style.opacity = '0';
                            if (color === 'rainbow') applyColor();
                            scheduleGlitch();
                        }
                    }
                    scramble();
                }

                scheduleGlitch();
                reg(() => { stopped = true; clearTimeout(timer); });
            }

            // Neon (centered text with layered neon glow, cycles color)
            function startNeon(text, sizeVmin, color, speed) {
                const el = makeEl('div', centered({
                    animation: `neonPulse ${2 / speed}s ease-in-out infinite`,
                }), text);

                const fit = () => fitEl(el, sizeVmin, 0.82);
                fit();
                onResize(fit);

                let colorIdx = 0;
                function applyNeon() {
                    const c = pickColor(color, colorIdx++);
                    el.style.color = c;
                    el.style.textShadow = [
                        '0 0 7px #fff',
                        '0 0 10px #fff',
                        '0 0 21px #fff',
                        `0 0 42px ${c}`,
                        `0 0 82px ${c}`,
                        `0 0 92px ${c}`,
                        `0 0 102px ${c}`,
                    ].join(', ');
                }
                applyNeon();

                let stopped = false, timer;
                function cycle() {
                    if (stopped) return;
                    if (color === 'rainbow') applyNeon();
                    timer = setTimeout(cycle, 2000 / speed);
                }
                timer = setTimeout(cycle, 2000 / speed);

                reg(() => {
                    stopped = true;
                    clearTimeout(timer);
                    screensaver.style.background = '#000';
                });
            }

            // Float (words drift around the screen)
            function startFloat(text, sizeVmin, color, speed) {
                const words = text.split(/\s+/).filter(Boolean);
                const pool = words.length > 1 ? words : [text.replace(/\s+/g, ' ')];
                const { W: W0, H: H0 } = dims();
                // fewer copies on a small screen so it doesn't turn into soup
                const density = Math.min(W0, H0) < 500 ? 2 : 4;
                const count = Math.max(6, Math.min(18, pool.length * density));
                const items = [];

                for (let i = 0; i < count; i++) {
                    const word = pool[i % pool.length];
                    const scale = 0.3 + Math.random() * 0.95;
                    const c = pickColor(color, i);
                    const op = (0.2 + Math.random() * 0.7).toFixed(2);
                    const el = makeEl('div', textCss({
                        position: 'absolute',
                        color: c,
                        opacity: op,
                        pointerEvents: 'none',
                    }), word);

                    fitEl(el, sizeVmin * scale, 0.8);

                    const x = Math.random() * Math.max(0, W0 - el.offsetWidth);
                    const y = Math.random() * Math.max(0, H0 - el.offsetHeight);
                    el.style.left = x + 'px';
                    el.style.top = y + 'px';

                    const angle = Math.random() * Math.PI * 2;
                    const spd = (0.25 + Math.random() * 0.85) * speed;
                    items.push({ el, scale, x, y, dx: Math.cos(angle) * spd, dy: Math.sin(angle) * spd });
                }

                onResize(() => {
                    const { W, H } = dims();
                    items.forEach(it => {
                        fitEl(it.el, sizeVmin * it.scale, 0.8);
                        it.x = Math.min(Math.max(0, it.x), Math.max(0, W - it.el.offsetWidth));
                        it.y = Math.min(Math.max(0, it.y), Math.max(0, H - it.el.offsetHeight));
                    });
                });

                let rafId;
                function frame() {
                    const { W, H } = dims();
                    items.forEach(it => {
                        it.x += it.dx; it.y += it.dy;
                        const w = it.el.offsetWidth || 80, h = it.el.offsetHeight || 40;
                        if (it.x < 0) { it.x = 0; it.dx = Math.abs(it.dx); }
                        if (it.x + w > W) { it.x = W - w; it.dx = -Math.abs(it.dx); }
                        if (it.y < 0) { it.y = 0; it.dy = Math.abs(it.dy); }
                        if (it.y + h > H) { it.y = H - h; it.dy = -Math.abs(it.dy); }
                        it.el.style.left = it.x + 'px';
                        it.el.style.top = it.y + 'px';
                    });
                    rafId = requestAnimationFrame(frame);
                }
                rafId = requestAnimationFrame(frame);
                reg(() => cancelAnimationFrame(rafId));
            }

            // init
            updatePreview();
        })();
    </script>
</body>
