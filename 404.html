<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="icon" href="images/romero.ico" type="image/x-icon">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Index of /</title>
    <style>
        @font-face {
            font-family: 'JetBrains Mono';
            font-style: normal;
            font-weight: 400;
            font-display: swap;
            src: url('https://cdnjs.cloudflare.com/ajax/libs/jetbrains-mono/2.304/web/woff2/JetBrainsMono-Regular.woff2') format('woff2');
        }

        :root {
            --bg-color: #121212;
            --text-color: #c7c7c7;
            --accent-color: #dacdac;
            --info-color: #c99999;
            --link-color: #577577;
            --link-hover: #60aaaa;
            --muted-color: #777;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'JetBrains Mono', monospace;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 1.5rem 1rem 2rem;
            font-size: 0.9rem;
            line-height: 1.5;
        }

        main {
            max-width: 820px;
            margin: 0 auto;
        }

        h1 {
            font-size: 1.4rem;
            font-weight: 400;
            color: var(--accent-color);
            letter-spacing: -0.5px;
        }

        .notice {
            color: var(--info-color);
            margin-top: 0.5rem;
        }

        .notice code {
            font: inherit;
            color: var(--accent-color);
            word-break: break-all;
        }

        hr {
            border: none;
            border-top: 1px solid rgba(255, 255, 255, 0.12);
            margin: 0.75rem 0;
        }

        .listing {
            overflow-x: auto;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            min-width: 520px;
        }

        th {
            text-align: left;
            font-weight: 400;
            color: var(--info-color);
            padding: 0 1.5rem 0.25rem 0;
            white-space: nowrap;
        }

        td {
            padding: 0.1rem 1.5rem 0.1rem 0;
            white-space: nowrap;
            vertical-align: baseline;
        }

        td:last-child,
        th:last-child {
            padding-right: 0;
            white-space: normal;
        }

        .size {
            text-align: right;
            color: var(--muted-color);
        }

        .desc {
            color: var(--muted-color);
        }

        a {
            color: var(--link-color);
            text-decoration: none;
        }

        a:hover {
            color: var(--link-hover);
            text-decoration: underline;
        }

        address {
            font-style: normal;
            color: var(--muted-color);
            font-size: 0.8rem;
        }
    </style>
</head>

<body>
    <main>
        <h1>Index of /</h1>
        <p class="notice">The requested URL <code id="requested-path">/</code> was not found on this server.</p>
        <hr>

        <div class="listing">
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th class="size">Size</th>
                        <th>Description</th>
                    </tr>
                </thead>
                <tbody id="listing-body">
                    <tr>
                        <td colspan="3" class="desc">Loading...</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <hr>
        <address>GitHub Pages Server at localhost.beer Port 443</address>
    </main>

    <script>
        // Directory list is pulled live from the repo tree.
        // Descriptions are the only hand-maintained part.
        // a directory with no entry here still gets listed.
        const descriptions = {
            '64': 'Base64 encoder & decoder',
            '754': 'IEEE-754 floating point converter',
            'a': 'Anchor playground',
            'ab': 'about:blank notepad',
            'azdor1099': 'AZ DOR 1099-S e-file generator',
            'bf': 'Password brute force calculator',
            'bm': 'Bookmarks',
            'cards': 'Card tools',
            'circle': 'Circle PFP cropper',
            'clipboard': 'Clipboard analyzer',
            'copy': 'Multi-clipboard',
            'crypt': 'Encryption & decryption',
            'dc': 'Diff checker',
            'dmc': 'Diacritical mark combiner',
            'files': 'Reference documents',
            'fj': 'JSON formatter',
            'h': 'Advanced replace',
            'hex': 'Binary file analyzer & hex editor',
            'http': 'HTTP request tool',
            'json': 'JSON output',
            'keygen': 'Keygen',
            'nc': 'Namecheap market parser',
            'pdf': 'PDF page organizer',
            'pixel': 'Pixel strip editor',
            'points': 'Point redemption optimizer',
            'qr': 'Interactive QR editor',
            'qrs': 'Sequence & bulk QR',
            'rng': 'Tuned RNG',
            'sc': 'Unicode UI stress test characters',
            'scroll': 'Scroll wheel tester',
            'skew': 'Skew width calculator',
            'ss': 'Text screensaver',
            'text': 'Redirect to /clipboard',
            'tf2': 'TF2 chat colorizer',
            'trim': 'Text trimmer',
            'u': 'String converter',
        };

        const TREE_URL = 'https://api.github.com/repos/purls/purls.github.io/git/trees/main?recursive=1';
        const CACHE_KEY = 'index-of-root';

        function formatSize(bytes) {
            if (bytes === null) return '-';
            if (bytes < 1024) return bytes + '';
            if (bytes < 1024 * 1024) return Math.round(bytes / 1024) + 'K';
            return (bytes / (1024 * 1024)).toFixed(1) + 'M';
        }

        // A route is a top-level directory holding a non-empty index.html.
        function routesFromTree(tree) {
            return tree
                .filter(node => node.type === 'blob' && node.size > 0 &&
                    /^[^/]+\/index\.html$/.test(node.path))
                .map(node => ({ name: node.path.split('/')[0], size: node.size }))
                .sort((a, b) => a.name.localeCompare(b.name));
        }

        function render(routes) {
            const body = document.getElementById('listing-body');
            body.textContent = '';

            const rows = [{ name: null }].concat(routes);
            for (const route of rows) {
                const tr = document.createElement('tr');

                const nameCell = document.createElement('td');
                const link = document.createElement('a');
                link.href = route.name === null ? '/' : `/${route.name}/`;
                link.textContent = route.name === null ? 'Parent Directory' : route.name + '/';
                nameCell.appendChild(link);

                const sizeCell = document.createElement('td');
                sizeCell.className = 'size';
                sizeCell.textContent = route.name === null ? '-' : formatSize(route.size);

                const descCell = document.createElement('td');
                descCell.className = 'desc';
                descCell.textContent = route.name === null ? '' : (descriptions[route.name] || '');

                tr.append(nameCell, sizeCell, descCell);
                body.appendChild(tr);
            }
        }

        // Last resort if the API is unreachable or rate limited is the list.
        function renderFallback() {
            render(Object.keys(descriptions).sort().map(name => ({ name, size: null })));
        }

        async function loadIndex() {
            const cached = sessionStorage.getItem(CACHE_KEY);
            if (cached) {
                try {
                    render(JSON.parse(cached));
                    return;
                } catch (error) {
                    sessionStorage.removeItem(CACHE_KEY);
                }
            }

            try {
                const response = await fetch(TREE_URL);
                if (!response.ok) throw new Error('HTTP ' + response.status);

                const data = await response.json();
                if (!Array.isArray(data.tree)) throw new Error('unexpected response');

                const routes = routesFromTree(data.tree);
                if (!routes.length) throw new Error('no routes found');

                sessionStorage.setItem(CACHE_KEY, JSON.stringify(routes));
                render(routes);
            } catch (error) {
                renderFallback();
            }
        }

        document.getElementById('requested-path').textContent = window.location.pathname;
        loadIndex();
    </script>
</body>

</html>
